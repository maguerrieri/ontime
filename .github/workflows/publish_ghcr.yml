name: Publish Docker image to GHCR

# Fork-specific pipeline: publishes ghcr.io/maguerrieri/ontime so this fork's
# patches ship without depending on upstream's Docker Hub workflow
# (build_docker.yml, which needs DOCKERHUB_* secrets we don't have).
#
# Note: the first published package is PRIVATE by default — flip it to public
# once at https://github.com/users/maguerrieri/packages/container/ontime/settings

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish_ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CI: ''

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SENTRY_AUTH_TOKEN intentionally omitted: the fork has no Sentry project,
      # and the build succeeds without it (source maps just aren't uploaded).
      - name: Build project packages
        run: pnpm build:docker

      - name: Docker Login
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Setup Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ontime
          # Stable (release or v* tag without a prerelease suffix): semver tags + latest.
          # Prerelease (release marked prerelease, or v* tag with a '-' suffix): nightly only.
          # workflow_dispatch: sha tag only — never moves latest.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'push' && !contains(github.ref_name, '-')) }}
            type=raw,value=nightly,enable=${{ (github.event_name == 'release' && github.event.release.prerelease) || (github.event_name == 'push' && contains(github.ref_name, '-')) }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
